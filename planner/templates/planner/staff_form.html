{% extends "planner/base.html" %}
{% block title %}Crear usuario · Maintenance Planner{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3">Crear usuario</h1>
        <p class="text-muted">Elige un rol. El usuario y la contraseña que configures se usarán para iniciar sesión.</p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary" type="submit">Crear cuenta</button>
          <a class="btn btn-outline-secondary" href="{% url 'staff-list' %}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
