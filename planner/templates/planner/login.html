{% extends "planner/base.html" %}
{% block title %}Ingresar · Mantenimiento{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5 col-xl-4">
    <div class="page-intro text-center mb-4">
      <span class="brand-mark mx-auto mb-3">M</span>
      <h1 class="h2 mb-2">Bienvenido</h1>
      <p>Ingresa para consultar y administrar el mantenimiento.</p>
    </div>
    <div class="card">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100 mt-2" type="submit">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
